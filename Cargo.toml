[package]
name = "idevice_pair"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
idevice = { version = "0.1.65", features = [
  "afc",
  "core_device_proxy",
  "house_arrest",
  "installation_proxy",
  "mdns",
  "mobile_image_mounter",
  "pair",
  "remote_pairing",
  "rsd",
  "tcp",
  "tss",
  "tunnel_tcp_stack",
  "usbmuxd",
] }
eframe = { version = "0.35.0", default-features = false, features = [
  "default_fonts",
  "accesskit",
  "wgpu",
] }
rfd = { version = "0.17", default-features = false }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "sync", "time"] }
futures-util = "0.3.33"
mdns-sd = "0.20"
uuid = { version = "1.24", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
reqwest = { version = "0.13", features = ["blocking"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
  "wayland",
  "x11",
] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
